name = "branc"
main = "worker/worker.ts"
compatibility_date = "2024-07-01"

# KV namespace for storing board metadata (list of boards, names, etc.)
kv_namespaces = [
  { binding = "BOARD_METADATA", id = "6fd8889c70ff4978b176263187bf163b" }
]

[dev]
port = 5172
ip = "0.0.0.0"

# Enable specific compatibility flags for WebSockets
compatibility_flags = [
  "nodejs_compat",
  "streams_enable_constructors"
]

# Set up the durable object used for each tldraw room
[durable_objects]
bindings = [
  { name = "TLDRAW_DURABLE_OBJECT", class_name = "TldrawDurableObject" },
]

# Durable objects require migrations to create/modify/delete them
[[migrations]]
tag = "v1"
new_classes = ["TldrawDurableObject"]

# We store rooms and asset uploads in an R2 bucket
[[r2_buckets]]
binding = 'TLDRAW_BUCKET'
bucket_name = 'branc-tldraw-content'
preview_bucket_name = 'branc-tldraw-content-preview'

# Explicit build configuration to ensure proper module format
[build]
command = ""
[build.upload]
format = "modules"